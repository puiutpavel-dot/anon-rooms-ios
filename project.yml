name: AnonRooms
options:
  bundleIdPrefix: ro.draghicioiu
  developmentLanguage: en
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.5.1
targets:
  AnonRooms:
    type: application
    platform: iOS
    sources:
      - path: AnonRooms
        excludes:
          - Info.plist
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: AnonRooms/Info.plist
      properties:
        CFBundleDisplayName: Anon Rooms
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ro, es, fr, de, it, pt, ar]
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.draghicioiu.anonrooms
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
schemes:
  AnonRooms:
    build:
      targets:
        AnonRooms: all
    run:
      config: Debug
    archive:
      config: Release
