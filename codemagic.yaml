# Anon Rooms → TestFlight, cu contul PERSONAL Codemagic (minute gratuite).
# Build-ul se pornește manual din Codemagic (Start new build), ca să nu consume minute la fiecare push.
#
# Înainte de primul build:
#  1. developer.apple.com → Identifiers → înregistrezi bundle ID-ul ro.draghicioiu.anonrooms,
#     apoi în App Store Connect creezi aplicația „Anon Rooms” cu acest bundle ID.
#  2. La „app_store_connect:” de mai jos pui numele unei integrări pe care o ai deja în Codemagic
#     (cheia App Store Connect e aceeași pentru toate aplicațiile tale) sau creezi una nouă cu numele anonrooms_asc.
#  3. Codemagic → codemagic.yaml settings → Code signing identities → iOS provisioning profiles →
#     Fetch profiles → alegi profilul App Store pentru ro.draghicioiu.anonrooms.

workflows:
  ios-testflight:
    name: Anon Rooms → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: anonrooms_asc
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ro.draghicioiu.anonrooms
      vars:
        XCODE_PROJECT: "AnonRooms.xcodeproj"
        XCODE_SCHEME: "AnonRooms"
      xcode: latest
    scripts:
      - name: Generează proiectul Xcode din project.yml
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Aplică semnarea (certificat + profil din Codemagic → Code signing identities)
        script: xcode-project use-profiles
      - name: Număr de build unic
        script: |
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = ${BUILD_NUMBER};/g" \
            "$XCODE_PROJECT/project.pbxproj"
      - name: Compilează IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
